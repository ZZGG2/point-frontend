name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { VITE_API_BASE_URL: "${{ vars.API_BASE_URL }}" }
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with: { name: dist, path: dist }

  deploy:
    # 정적 파일 이중 배포: S3(Main) + GCS(DR). DR 시 Route 53 이 www 를 GCS 쪽으로 전환 (ADR-0010)
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: aws-actions/configure-aws-credentials@v6
        with: { role-to-assume: "${{ vars.AWS_FRONTEND_ROLE_ARN }}", aws-region: ap-northeast-2 }
      - name: S3 업로드 + CloudFront 무효화
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete
          aws cloudfront create-invalidation --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --paths "/index.html"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FRONTEND_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: GCS 업로드 (DR)
        run: gcloud storage rsync dist "gs://${{ vars.GCS_BUCKET }}" --recursive --delete-unmatched-destination-objects
