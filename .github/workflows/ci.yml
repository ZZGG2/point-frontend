name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write     # OIDC (AWS, GCP)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build-push:
    # web 컨테이너 이미지(nginx-unprivileged) → ECR + Artifact Registry 이중 푸시 (ADR-0015, ADR-0010)
    # 배포는 point-infra 의 ArgoCD 가 담당 (ADR-0012) → 이 레포는 이미지 태그 bump PR 만 만든다
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t web:${{ github.sha }} .
      - name: Trivy scan (CRITICAL 시 실패)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (커밋 SHA 고정: 태그 변조 대비)
        with: { image-ref: "web:${{ github.sha }}", severity: CRITICAL, exit-code: "1" }
      - name: 이중 푸시 — ECR + Artifact Registry
        run: |
          echo "TODO: AWS OIDC(vars.AWS_ECR_ROLE_ARN) · GCP WIF(vars.GCP_WIF_PROVIDER, vars.GCP_AR_SA) 인증 후"
          echo "TODO: docker tag/push → ECR(web), asia-northeast3-docker.pkg.dev/<project>/point-apps/web"

  bump-infra:
    if: github.ref == 'refs/heads/main'
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: 이미지 태그 bump PR 생성
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "TODO: point-infra overlays(aws, gcp-dr) 의 web 이미지 태그 → $TAG (backend ci 의 bump-infra 와 동일 방식)"
