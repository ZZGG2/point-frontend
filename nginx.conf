server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # 해시가 붙은 빌드 산출물은 오래 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 라우팅: 없는 경로(/admin 등)는 index.html, index.html 은 매번 재검증
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
